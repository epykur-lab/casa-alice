<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anfragen · Casa Alice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/icons/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="images/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#102d37" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="book">
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="kicker" style="color:var(--terracotta)" data-i="bookKicker"></div>
      <h1 data-i="bookTitle"></h1>
      <p data-i="bookLede"></p>
    </div>
  </section>
  <section class="section tight">
    <div class="wrap book-layout">
      <div class="panel">
        <div id="calendar"></div>
        <p class="note" style="margin-top:18px" data-i="bookNote"></p>
      </div>
      <div class="panel">
        <form id="request-form">
          <div>
            <label data-i="formUnit"></label>
            <select name="unit" required>
              <option value="apartment">Apartment</option>
              <option value="wg">Gartengeschoss / WG</option>
            </select>
          </div>
          <div class="form-row">
            <div>
              <label data-i="formArrive"></label>
              <input id="arrive" name="arrive" type="date" required />
            </div>
            <div>
              <label data-i="formLeave"></label>
              <input id="leave" name="leave" type="date" required />
            </div>
          </div>
          <div class="form-row">
            <div>
              <label data-i="formGuests"></label>
              <select name="guests">
                <option>1</option>
                <option selected>2</option>
                <option>3</option>
                <option>4</option>
              </select>
            </div>
            <div>
              <label data-i="formName"></label>
              <input name="name" required />
            </div>
          </div>
          <div>
            <label data-i="formEmail"></label>
            <input name="email" type="email" required />
          </div>
          <div>
            <label data-i="formMsg"></label>
            <textarea name="message"></textarea>
          </div>
          <button class="btn" type="submit" data-i="formSend"></button>
          <div id="form-ok" class="success" data-i="formOk"></div>
        </form>
      </div>
    </div>
  </section>
  <footer id="site-footer"></footer>
  <script src="site.js"></script>
</body>
</html>
