<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt · Casa Alice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/icons/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="images/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#102d37" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <h1 data-i="contactTitle"></h1>
      <p data-i="contactLede"></p>
    </div>
  </section>
  <section class="section tight">
    <div class="wrap book-layout">
      <div class="panel">
        <form id="request-form">
          <div>
            <label data-i="formName"></label>
            <input name="name" required />
          </div>
          <div>
            <label data-i="formEmail"></label>
            <input type="email" name="email" required />
          </div>
          <div>
            <label data-i="formMsg"></label>
            <textarea name="message" required></textarea>
          </div>
          <button class="btn" type="submit" data-i="formSend"></button>
          <div id="form-ok" class="success" data-i="formOk"></div>
        </form>
      </div>
      <div>
        <div class="photo-frame wide"><img src="images/baskets.jpg" alt="Detail Bad" /></div>
        <p class="muted" style="margin-top:16px">WhatsApp-Nummer und Mail setzen wir ein, sobald ihr sie für die öffentliche Seite freigebt.</p>
      </div>
    </div>
  </section>
  <footer id="site-footer"></footer>
  <script src="site.js"></script>
</body>
</html>
