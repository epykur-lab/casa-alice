<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casa Alice · Ponta do Sol, Madeira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/icons/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="images/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#102d37" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">
  <div id="site-header"></div>
  <section class="hero">
    <div class="hero-slides" id="hero-slides" aria-hidden="true">
      <img class="is-on" src="images/slides/01-pool.jpg" alt="" />
      <img src="images/slides/02-garden-sea.jpg" alt="" />
      <img src="images/slides/03-terrace-flowers.jpg" alt="" />
      <img src="images/slides/04-table-sea.jpg" alt="" />
      <img src="images/slides/05-mango.jpg" alt="" />
      <img src="images/slides/06-persimmon-tree.jpg" alt="" />
      <img src="images/slides/07-harvest.jpg" alt="" />
      <img src="images/slides/08-protea.jpg" alt="" />
      <img src="images/slides/09-poem-madeira.jpg" alt="" />
      <img src="images/slides/10-hedge-night.jpg" alt="" />
      <img src="images/slides/11-terrace-night.jpg" alt="" />
      <img src="images/slides/12-valley-night.jpg" alt="" />
      <img src="images/slides/13-window-desk.jpg" alt="" />
    </div>
    <div class="hero-copy">
      <div class="hero-glass">
        <div class="kicker" data-i="heroKicker"></div>
        <h1 data-i="heroTitle"></h1>
        <p class="lede" data-i="heroLede"></p>
        <p class="hero-actions">
          <a class="btn" href="book.html" data-i="heroCta"></a>
          <a class="btn light" href="the-place.html" data-i="heroStory"></a>
        </p>
      </div>
    </div>
  </section>
  <section class="quote-band" aria-label="Zitat">
    <div class="wrap">
      <blockquote>
        <p class="quote-pt">Há um país onde o mar é mais azul.</p>
        <p class="quote-tr" data-i="homeQuoteTr"></p>
      </blockquote>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <div class="kicker" style="color:var(--terracotta)" data-i="unitsKicker"></div>
      <h2 data-i="unitsTitle"></h2>
      <div class="cards" style="margin-top:28px">
        <article class="card">
          <img src="images/pool-day.jpg" alt="Pool zwischen Bougainvillea" />
          <div class="card-body">
            <div class="meta" data-i="aptMeta"></div>
            <h3 data-i="aptTitle"></h3>
            <p data-i="homeAptText"></p>
            <a class="btn ghost" href="apartment.html" data-i="more"></a>
          </div>
        </article>
        <article class="card">
          <img src="images/terrace-eg.jpg" alt="Lange Terrasse des Gartengeschosses" />
          <div class="card-body">
            <div class="meta" data-i="wgMeta"></div>
            <h3 data-i="wgTitle"></h3>
            <p data-i="homeWgText"></p>
            <a class="btn ghost" href="wg.html" data-i="more"></a>
          </div>
        </article>
      </div>
    </div>
  </section>
  <section class="section tight" style="padding-top:0">
    <div class="wrap grid-2">
      <div class="photo-frame tall"><img src="images/garden-path.jpg" alt="Weg durch die erste Gartenebene" /></div>
      <div>
        <div class="kicker" style="color:var(--terracotta)" data-i="homePlaceKicker"></div>
        <h2 data-i="homePlaceTitle"></h2>
        <p class="muted" data-i="homePlaceLede"></p>
        <p><a class="btn" href="the-place.html" data-i="homePlaceCta"></a></p>
      </div>
    </div>
  </section>
  <footer id="site-footer"></footer>
  <script src="site.js"></script>
</body>
</html>
